<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08151B" />
    <meta name="description" content="Mosslight Commons — a creature-city simulation of a lantern-lit basin." />
    <link rel="icon" href="/favicon.svg" />
    <title>Mosslight Commons</title>
    <style>
      /*
        Inlined on purpose. This is the only thing standing between the player
        and a blank dark rectangle while the module graph and Phaser parse, so
        it must paint on the first frame — before any stylesheet has arrived.
      */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #f5e6c8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        background: radial-gradient(circle at 50% 0%, #153d3a 0%, #08151b 58%);
        transition: opacity 420ms ease;
      }
      #boot[data-done] { pointer-events: none; opacity: 0; }
      #boot h1 {
        margin: 0;
        color: #63e6d4;
        font-family: Georgia, serif;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.34em;
      }
      #boot p { max-width: 42ch; margin: 0; color: #9eb9ad; font-size: 12px; line-height: 1.6; }
      #boot-track {
        overflow: hidden;
        width: min(260px, 70vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(245, 230, 200, 0.14);
      }
      #boot-bar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #63e6d4, #f4b85b);
        transition: width 220ms ease;
      }
      #boot-error { color: #e87968; }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot-bar { transition: none; }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Mosslight Commons game">
      <div id="game" aria-label="Mosslight Commons world"></div>
      <div id="hud"></div>
    </main>

    <div id="boot" role="status" aria-live="polite">
      <h1>MOSSLIGHT</h1>
      <div id="boot-track" role="progressbar" aria-label="Loading the basin" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="boot-bar"></div>
      </div>
      <p id="boot-message">Waking the basin…</p>
      <noscript>
        <p id="boot-error">Mosslight Commons is a live simulation and needs JavaScript enabled to run.</p>
      </noscript>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
